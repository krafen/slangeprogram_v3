<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8" />
<script src="https://cdn.jsdelivr.net/npm/jsuites/dist/jsuites.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsuites/dist/jsuites.css" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/jspreadsheet-ce@4/dist/index.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jspreadsheet-ce@4/dist/jspreadsheet.min.css" type="text/css" />
<style>
  html, body {
    margin: 0;
    padding: 4px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .jexcel_container {
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
    border-radius: 4px;
  }

  /* Modal styles for paste fallback */
  #paste-modal {
    display: none;
    position: fixed;
    z-index: 99999;
    left: 0; top: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.45);
    align-items: center;
    justify-content: center;
  }
  #paste-modal .modal-inner {
    background: white;
    padding: 16px;
    border-radius: 8px;
    width: min(820px, 92%);
    max-height: 80vh;
    overflow: auto;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
  }
  #paste-modal h3 { margin: 0 0 8px 0; font-size: 1.05rem; }
  #paste-modal p { margin: 0 0 12px 0; color: #333; }
  #paste-modal .catcher {
    min-height: 160px;
    border: 1px dashed #cbd5e1;
    padding: 8px;
    border-radius: 6px;
    background: #fafafa;
    outline: none;
    white-space: pre-wrap;
  }
  #paste-modal .buttons { margin-top:12px; display:flex; gap:8px; justify-content:flex-end; }
  .btn { padding: 8px 12px; border-radius:6px; border: none; cursor: pointer; font-weight:600; }
  .btn-primary { background:#0F6E5B; color:white; }
  .btn-ghost { background:transparent; border:1px solid #cbd5e1; color:#111; }
</style>
</head>
<body>
<div id="spreadsheet"></div>

<!-- Modal used as visible fallback for paste -->
<div id="paste-modal" role="dialog" aria-modal="true">
  <div class="modal-inner">
    <h3>Paste (inneholder flere celler)</h3>
    <p>Lim inn (Ctrl+V / ⌘+V) i boksen under og trykk «Use pasted content». Dette er en fallback som garantert fungerer i alle nettlesere.</p>
    <div id="paste-modal-catcher" class="catcher" contenteditable="true" spellcheck="false" aria-label="Paste area"></div>
    <div class="buttons">
      <button id="paste-modal-cancel" class="btn btn-ghost">Cancel</button>
      <button id="paste-modal-ok" class="btn btn-primary">Use pasted content</button>
    </div>
  </div>
</div>

<script>
  // Minimal Streamlit component shim
  const Streamlit = (() => {
    const RENDER_EVENT = "streamlit:render";
    let lastFrameHeight = null;
    const renderListeners = [];
    function sendBackMsg(type, data) {
      window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*");
    }
    function setComponentReady() {
      window.addEventListener("message", (event) => {
        const data = event.data;
        if (data && data.type === RENDER_EVENT) {
          const args = data.args || {};
          renderListeners.forEach((callback) => callback(args));
        }
      });
      sendBackMsg("streamlit:componentReady", { apiVersion: 1 });
    }
    function setFrameHeight(height) {
      const resolvedHeight = height === undefined ? document.body.scrollHeight : height;
      if (resolvedHeight === lastFrameHeight) return;
      lastFrameHeight = resolvedHeight;
      sendBackMsg("streamlit:setFrameHeight", { height: resolvedHeight });
    }
    function setComponentValue(value) {
      sendBackMsg("streamlit:setComponentValue", { value: value, dataType: "json" });
    }
    function onRender(callback) {
      renderListeners.push(callback);
    }
    return { setComponentReady, setFrameHeight, setComponentValue, onRender };
  })();

  let spreadsheetInstance = null;
  let lastRevision = null;

  function sendValueToStreamlit() {
    if (!spreadsheetInstance) return;
    const currentData = spreadsheetInstance.getData();
    Streamlit.setComponentValue(currentData);
    Streamlit.setFrameHeight();
  }

  function ensureColumnsHaveType(columns) {
    return columns.map(col => {
      if (typeof col === 'string') return { title: col, type: 'text' };
      const c = Object.assign({}, col);
      if (!c.type) c.type = 'text';
      return c;
    });
  }

  // Parsing utilities (same robust parsing as before)
  function parsePlainText(text) {
    if (text === null || text === undefined) return [];
    const s = String(text).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    const lines = s.split('\n').filter(line => line !== undefined);
    let sample = "";
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].trim().length > 0) { sample = lines[i]; break; }
    }
    const counts = { tab: (sample.match(/\t/g) || []).length, semicolon: (sample.match(/;/g) || []).length, comma: (sample.match(/,/g) || []).length };
    let delimiter = null;
    if (counts.tab > 0) delimiter = '\t';
    else if (counts.semicolon > 0 && counts.semicolon >= counts.comma) delimiter = ';';
    else if (counts.comma > 0) delimiter = ',';
    if (!delimiter) {
      const rows = lines.map(line => line.trim()).filter(line => line.length > 0).map(line => line.split(/\s{2,}/).map(cell => cell.replace(/\u00A0/g,' ').trim()));
      return rows;
    }
    const rows = lines.map(line => line.split(delimiter).map(cell => cell.replace(/\u00A0/g,' ').trim()));
    return rows.filter(r => r.length > 0);
  }

  function parseHtmlClipboard(htmlText) {
    if (!htmlText) return null;
    try {
      let fragment = htmlText;
      const startMarker = /<!--\s*StartFragment\s*-->/i;
      const endMarker = /<!--\s*EndFragment\s*-->/i;
      if (startMarker.test(htmlText) && endMarker.test(htmlText)) {
        const parts = htmlText.split(startMarker);
        if (parts.length > 1) fragment = parts[1].split(endMarker)[0];
      }
      const doc = new DOMParser().parseFromString(fragment, 'text/html');
      let table = doc.querySelector('table');
      if (table) {
        const rows = Array.from(table.querySelectorAll('tr')).map(tr =>
          Array.from(tr.querySelectorAll('td,th')).map(td => {
            const clone = td.cloneNode(true);
            clone.querySelectorAll('br').forEach(b => b.replaceWith('\n'));
            return clone.textContent.replace(/\u00A0/g,' ').trim();
          })
        );
        const nonEmpty = rows.filter(r => r.some(c => String(c).trim() !== ""));
        if (nonEmpty.length) return nonEmpty;
      }
      const body = doc.body;
      if (body) {
        const cloneBody = body.cloneNode(true);
        cloneBody.querySelectorAll('br').forEach(b => b.replaceWith('\n'));
        const text = cloneBody.innerText || cloneBody.textContent || "";
        const rows = parsePlainText(text);
        if (rows && rows.length) return rows;
      }
    } catch (e) { console.debug("parseHtmlClipboard failed", e); }
    return null;
  }

  function parseClipboardEvent(evt) {
    try {
      const cd = (evt && evt.clipboardData) ? evt.clipboardData : null;
      if (!cd) return [];
      try {
        const types = Array.from(cd.types || []);
        const previewHtml = (cd.getData('text/html') || '').slice(0, 800);
        const previewText = (cd.getData('text/plain') || '').slice(0, 800);
        console.debug("Clipboard types:", types, "htmlPreview:", previewHtml.substring(0,200), "textPreview:", previewText.substring(0,200));
      } catch (e) { console.debug("preview failed", e); }

      try {
        const plain = cd.getData('text/plain');
        if (plain) {
          let parsed = parsePlainText(plain);
          if (parsed && parsed.length && parsed.every(r => r.length === 1 && typeof r[0] === 'string' && r[0].indexOf('\t') !== -1)) {
            parsed = parsed.map(r => r[0].split('\t').map(cell => cell.replace(/\u00A0/g,' ').trim()));
            console.debug("Post-split on tabs produced shape:", parsed.length, parsed[0] ? parsed[0].length : 0);
          }
          if (parsed && parsed.length) return parsed;
        }
      } catch (e) { console.debug("getData('text/plain') threw", e); }

      try {
        const html = cd.getData('text/html');
        if (html) {
          const parsed = parseHtmlClipboard(html);
          if (parsed && parsed.length) return parsed;
        }
      } catch (e) { console.debug("getData('text/html') threw", e); }

      try {
        if (cd.items && cd.items.length) {
          for (let i = 0; i < cd.items.length; i++) {
            const it = cd.items[i];
            if (it.type === 'text/plain' || it.type === 'text/html') {
              try {
                const v = cd.getData(it.type);
                const parsed = it.type === 'text/html' ? parseHtmlClipboard(v) : parsePlainText(v);
                if (parsed && parsed.length) return parsed;
              } catch (e) {}
            }
          }
        }
      } catch (e) { console.debug("items read failed", e); }
    } catch (outerErr) { console.debug("parseClipboardEvent outerErr", outerErr); }
    return [];
  }

  // navigator.clipboard fallback
  async function readClipboardViaNavigator() {
    try {
      if (navigator.clipboard && navigator.clipboard.read) {
        const items = await navigator.clipboard.read();
        for (const item of items) {
          if (item.types.includes('text/html')) {
            const blob = await item.getType('text/html');
            const html = await blob.text();
            const parsed = parseHtmlClipboard(html);
            if (parsed && parsed.length) return parsed;
          }
          if (item.types.includes('text/plain')) {
            const blob = await item.getType('text/plain');
            const txt = await blob.text();
            const parsed = parsePlainText(txt);
            if (parsed && parsed.length) return parsed;
          }
        }
      }
    } catch (e) { console.debug("navigator.clipboard.read() failed", e); }
    try {
      if (navigator.clipboard && navigator.clipboard.readText) {
        const txt = await navigator.clipboard.readText();
        const parsed = parsePlainText(txt);
        if (parsed && parsed.length) return parsed;
      }
    } catch (e) { console.debug("navigator.clipboard.readText() failed", e); }
    return [];
  }

  // Modal dialog fallback: show modal, focus contenteditable, user pastes and clicks Use pasted content
  function installPasteHandler(container) {
  if (!container) return;

  // Single unified paste handler (we'll attach it to multiple targets)
  async function handlePasteEvent(e) {
    try {
      console.debug("paste event received; target:", e.target, "event:", e);
      // Prevent default only for events originating from the component container
      // but allow other targets to behave normally.
      if (container.contains(e.target) || e.target === container) {
        e.preventDefault();
        e.stopPropagation();
      }

      // 1) Try parse from event.clipboardData (if present)
      let rows = parseClipboardEvent(e);
      console.debug("Parsed rows from paste event:", rows && rows.length ? rows.slice(0,8) : rows);

      // 2) If nothing, try navigator.clipboard.read() (async)
      if ((!rows || !rows.length) && navigator.clipboard) {
        try {
          const navRows = await readClipboardViaNavigator();
          if (navRows && navRows.length) {
            rows = navRows;
            console.debug("Parsed rows from navigator.clipboard:", rows && rows.length ? rows.slice(0,8) : rows);
          }
        } catch (navErr) {
          console.debug("navigator.clipboard read failed in paste handler", navErr);
        }
      }

      // 3) If still empty, show visible modal fallback
      if ((!rows || !rows.length)) {
        const modalRows = await showPasteModalAndWait();
        if (modalRows && modalRows.length) {
          rows = modalRows;
          console.debug("Parsed rows from modal:", rows && rows.length ? rows.slice(0,8) : rows);
        }
      }

      if (!rows || !rows.length) {
        console.debug("No rows parsed after paste event + fallbacks.");
        return;
      }

      // Ensure table columns won't collapse into a single column
      let currentCols = 0;
      try {
        const currentData = spreadsheetInstance.getData() || [];
        if (currentData && currentData.length) currentCols = currentData[0].length;
      } catch (err) { currentCols = 0; }
      try {
        if ((!currentCols || currentCols === 0) && spreadsheetInstance && spreadsheetInstance.options && spreadsheetInstance.options.columns) {
          currentCols = spreadsheetInstance.options.columns.length || 0;
        }
      } catch (err) {}
      if (!currentCols || currentCols === 0) currentCols = rows[0] ? rows[0].length : 0;

      const paddedRows = rows.map(r => {
        const newRow = Array.from(r);
        if (newRow.length < currentCols) {
          while (newRow.length < currentCols) newRow.push("");
        }
        return newRow;
      });

      try {
        spreadsheetInstance.setData(paddedRows);
        sendValueToStreamlit();
      } catch (err) {
        console.warn("setData failed - fallback building newData", err);
        try {
          const current = spreadsheetInstance.getData() || [];
          const maxRows = Math.max(current.length, paddedRows.length);
          const maxCols = Math.max((current[0] || []).length, paddedRows[0] ? paddedRows[0].length : 0);
          const newData = [];
          for (let r = 0; r < maxRows; r++) {
            const row = [];
            for (let c = 0; c < maxCols; c++) {
              const v = (paddedRows[r] && paddedRows[r][c] !== undefined) ? paddedRows[r][c] : ((current[r] && current[r][c] !== undefined) ? current[r][c] : "");
              row.push(v);
            }
            newData.push(row);
          }
          spreadsheetInstance.setData(newData);
          sendValueToStreamlit();
        } catch (err2) {
          console.error("Fallback paste failed", err2);
        }
      }
    } catch (outer) {
      console.error("handlePasteEvent outer error", outer);
    }
  }

  // Attach to the component container (capture phase), plus document and window to catch cases where target differs
  container.addEventListener('paste', handlePasteEvent, true);
  document.addEventListener('paste', handlePasteEvent, true);
  window.addEventListener('paste', handlePasteEvent, true);

  // Keydown fallback: if Ctrl/Cmd+V is pressed and paste events are being swallowed,
  // attempt an explicit navigator.clipboard.readText() and parse it.
  // This does NOT prevent default - it only triggers a parse attempt in addition.
  document.addEventListener('keydown', async function (ev) {
    try {
      if ((ev.ctrlKey || ev.metaKey) && (ev.key === 'v' || ev.key === 'V')) {
        console.debug("keydown paste detected (Ctrl/Cmd+V)");
        if (!spreadsheetInstance) return;
        // Attempt to read clipboard text (user gesture)
        try {
          if (navigator.clipboard && navigator.clipboard.readText) {
            const txt = await navigator.clipboard.readText();
            console.debug("navigator.clipboard.readText() yielded text length", (txt || '').length);
            let rows = parsePlainText(txt);
            // Defensive split if single column containing tabs
            if (rows && rows.length && rows.every(r => r.length === 1 && typeof r[0] === 'string' && r[0].indexOf('\t') !== -1)) {
              rows = rows.map(r => r[0].split('\t').map(cell => cell.replace(/\u00A0/g,' ').trim()));
              console.debug("Post-split on tabs (keydown fallback) shape:", rows.length, rows[0] ? rows[0].length : 0);
            }
            if (rows && rows.length) {
              // pad & set like above
              let currentCols = 0;
              try {
                const currentData = spreadsheetInstance.getData() || [];
                if (currentData && currentData.length) currentCols = currentData[0].length;
              } catch (err) { currentCols = 0; }
              if (!currentCols || currentCols === 0) currentCols = rows[0] ? rows[0].length : 0;
              const paddedRows = rows.map(r => {
                const newRow = Array.from(r);
                if (newRow.length < currentCols) while (newRow.length < currentCols) newRow.push("");
                return newRow;
              });
              spreadsheetInstance.setData(paddedRows);
              sendValueToStreamlit();
              return;
            }
          }
        } catch (err) {
          console.debug("keydown clipboard.readText() failed", err);
        }
      }
    } catch (err) {
      console.debug("keydown paste fallback outer error", err);
    }
  }, true);
}

  // Main renderer called by Streamlit
  function renderSpreadsheet(args) {
    const data = args.data || [];
    const rawColumns = args.columns || [];
    const height = args.height || 400;
    const revision = args.revision;
    const defaultRows = args.default || null;

    if (spreadsheetInstance && revision === lastRevision) {
      Streamlit.setFrameHeight();
      return;
    }
    lastRevision = revision;

    const container = document.getElementById("spreadsheet");
    container.innerHTML = "";

    const columns = ensureColumnsHaveType(rawColumns);
    const initialData = (Array.isArray(data) && data.length) ? data : (defaultRows ? defaultRows : [columns.map(() => "")]);

    spreadsheetInstance = jspreadsheet(container, {
      data: initialData,
      columns: columns,
      tableOverflow: true,
      tableHeight: (height) + "px",
      tableWidth: "100%",
      allowInsertRow: true,
      allowDeleteRow: true,
      allowInsertColumn: true,
      allowDeleteColumn: false,
      columnSorting: false,
      parsePaste: function(clipboardText) {
        try {
          if (typeof clipboardText === 'string' && clipboardText.toLowerCase().indexOf('<table') !== -1) {
            const parsed = parseHtmlClipboard(clipboardText);
            if (parsed && parsed.length) return parsed;
          }
        } catch (e){}
        return parsePlainText(clipboardText || "");
      },
      onchange: sendValueToStreamlit,
      onafterchanges: sendValueToStreamlit,
      oninsertrow: sendValueToStreamlit,
      ondeleterow: sendValueToStreamlit,
      onmoverow: sendValueToStreamlit,
    });

    installPasteHandler(container);

    // initial round-trip
    sendValueToStreamlit();
    Streamlit.setFrameHeight();
  }

  Streamlit.onRender(renderSpreadsheet);
  Streamlit.setComponentReady();
  Streamlit.setFrameHeight();
</script>
</body>
</html>
